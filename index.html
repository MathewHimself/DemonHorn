<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Рог Демона</title>
  <link rel="stylesheet" href="Stylesheets/style.css">
</head>
<body>

  <main class="slides">

    <!-- Слайд 1. Главный экран -->
    <section class="slide slide--hero" id="main" aria-label="Rog Demona">
      <div class="stage">
        <nav class="nav" aria-label="Разделы">
          <a class="nav__link nav__link--main" href="#main">Главная</a>
          <a class="nav__link nav__link--chapters" href="#chapters">Главы</a>
        </nav>

        <div class="horn" aria-hidden="true">
          <img class="horn__img" src="images/horn-engraving.png" alt="">
        </div>

        <h1 class="title">
          <span class="title__rog">Rog</span>
          <span class="title__demona">Demona</span>
        </h1>

        <p class="tagline">Злость не на людей, а на результат</p>
      </div>
    </section>

    <!-- Слайд 2. Инструкция — наезжает на главный экран при прокрутке -->
    <section class="slide slide--steps" id="chapters" aria-labelledby="steps-title">
      <div class="slide__rim" aria-hidden="true"></div>
      <div class="slide__panel">
      <div class="stage">
        <h2 class="steps__title" id="steps-title">Инструкция по применению</h2>

        <ol class="steps">
          <li class="step step--1">
            <img class="step__img" src="images/step-1.gif" alt="Мраморный герой касается сломанного рога на колонне">
            <p class="step__text">Шаг 1. Дотроньтесь до рога</p>
          </li>
          <li class="step step--2">
            <img class="step__img" src="images/step-2.gif" alt="Мраморный герой сдерживает гнев, вокруг головы молнии">
            <p class="step__text">Шаг 2. Успокойтесь</p>
          </li>
          <li class="step step--3">
            <img class="step__img" src="images/step-3.gif" alt="Мраморный варвар стоит у сундука">
            <p class="step__text">Шаг 3. Приготовьтесь к&nbsp;последствиям</p>
          </li>
        </ol>
      </div>
      </div>
    </section>

    <!-- Слайд 3. Гнев проявляется: красное фото поверх серого.
         Прокрутка проявляет его целиком, курсор — линза с эффектом pinch -->
    <section class="slide slide--rage" aria-label="Спокойное лицо, на котором проявляется гнев">
      <div class="slide__rim" aria-hidden="true"></div>
      <div class="slide__panel rage">
        <div class="rage__fallback" aria-hidden="true">
          <img class="rage__img rage__img--grey" src="images/rage-grey.jpg" alt="">
          <img class="rage__img rage__img--red" src="images/rage-red.jpg" alt="">
        </div>
        <canvas class="rage__canvas" aria-hidden="true"></canvas>
      </div>
    </section>

    <!-- Запас прокрутки, пока проявляется третий слайд -->
    <div class="slides__tail" aria-hidden="true"></div>

    <!-- Слайд 4. Отзывы: бесконечное поле окон, тянется мышью во все стороны.
         Список ниже — источник: scripts.js раскладывает его по окнам
         в шахматном порядке (отзыв — фото — отзыв…) -->
    <section class="slide slide--reviews" aria-labelledby="reviews-title">
      <div class="slide__rim" aria-hidden="true"></div>
      <div class="slide__panel reviews">
        <h2 class="visually-hidden" id="reviews-title">Отзывы</h2>

        <ul class="reviews__source visually-hidden">
          <li>
            <figure class="review">
              <blockquote class="review__text">Сдал гнев в понедельник. Во вторник он вернулся вместе с моей бывшей.</blockquote>
              <figcaption class="review__meta"><span class="review__name">Артём, 27</span><span class="review__count">Гнев сдан: 3 раза</span></figcaption>
            </figure>
          </li>
          <li>
            <figure class="review">
              <blockquote class="review__text">Рог тёплый на ощупь. Начальник теперь кажется милым. Подозрительно.</blockquote>
              <figcaption class="review__meta"><span class="review__name">Вика, 31</span><span class="review__count">Гнев сдан: 1 раз</span></figcaption>
            </figure>
          </li>
          <li>
            <figure class="review">
              <blockquote class="review__text">Шаг 2 дался тяжелее всего. Успокаивался три дня, зато сундук цел.</blockquote>
              <figcaption class="review__meta"><span class="review__name">Глеб, 24</span><span class="review__count">Гнев сдан: 2 раза</span></figcaption>
            </figure>
          </li>
          <li>
            <figure class="review">
              <blockquote class="review__text">Взяла рог на семейный ужин. Впервые за десять лет никто не спорил о политике.</blockquote>
              <figcaption class="review__meta"><span class="review__name">Лиза, 35</span><span class="review__count">Гнев сдан: 7 раз</span></figcaption>
            </figure>
          </li>
          <li>
            <figure class="review">
              <blockquote class="review__text">Гнев вернулся ровно через месяц, как и обещали. За пунктуальность пять звёзд.</blockquote>
              <figcaption class="review__meta"><span class="review__name">Тимур, 29</span><span class="review__count">Гнев сдан: 4 раза</span></figcaption>
            </figure>
          </li>
          <li>
            <p class="review review--motto">Отдай гнев сейчас&nbsp; - испытай его потом</p>
          </li>
          <li>
            <figure class="review">
              <blockquote class="review__text">Купил второй рог для соседа с перфоратором. Теперь мы оба спокойны. Пока.</blockquote>
              <figcaption class="review__meta"><span class="review__name">Олег, 42</span><span class="review__count">Гнев сдан: 12 раз</span></figcaption>
            </figure>
          </li>
          <li>
            <figure class="review">
              <blockquote class="review__text">Положил рог под подушку. Всю ночь снились мраморные греки, пинающие сундуки.</blockquote>
              <figcaption class="review__meta"><span class="review__name">Даня, 19</span><span class="review__count">Гнев сдан: 1 раз</span></figcaption>
            </figure>
          </li>
          <li>
            <figure class="review">
              <blockquote class="review__text">Отдала гнев за пробки. Теперь стою в них с очень спокойной улыбкой.</blockquote>
              <figcaption class="review__meta"><span class="review__name">Марина, 33</span><span class="review__count">Гнев сдан: 9 раз</span></figcaption>
            </figure>
          </li>
          <li>
            <figure class="review">
              <blockquote class="review__text">Не верил, пока не дотронулся. Теперь верю и немного боюсь.</blockquote>
              <figcaption class="review__meta"><span class="review__name">Саша, 22</span><span class="review__count">Гнев сдан: 1 раз</span></figcaption>
            </figure>
          </li>
          <li>
            <figure class="review">
              <blockquote class="review__text">Гнев вернулся и привёл друзей. Претензий не имею: нас предупреждали.</blockquote>
              <figcaption class="review__meta"><span class="review__name">Ника, 26</span><span class="review__count">Гнев сдан: 5 раз</span></figcaption>
            </figure>
          </li>
        </ul>

        <div class="reviews__faces" hidden>
          <img class="reviews__face" src="images/face-1.jpg" alt="">
          <img class="reviews__face" src="images/face-2.jpg" alt="">
          <img class="reviews__face" src="images/face-3.jpg" alt="">
        </div>

        <div class="reviews__field" aria-hidden="true"></div>
      </div>
    </section>

  </main>

  <script src="Javascripts/scripts.js"></script>
</body>
</html>
